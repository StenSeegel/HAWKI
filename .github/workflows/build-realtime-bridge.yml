name: Build realtime-bridge image

on:
  push:
    branches: [dev-local]
    paths:
      - '_docker/realtime-bridge/**'
      - '.github/workflows/build-realtime-bridge.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/stenseegel/hawki-realtime-bridge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: _docker/realtime-bridge
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
