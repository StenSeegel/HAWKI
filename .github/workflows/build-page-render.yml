name: Build page-render image

# The slide renderer sidecar (LibreOffice + poppler behind a small FastAPI).
# Deployed stacks pull it from GHCR like the realtime bridge; dev builds it
# locally from _docker/page-render.

on:
  push:
    branches: [dev-local, staging]
    paths:
      - '_docker/page-render/**'
      - '.github/workflows/build-page-render.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/stenseegel/hawki-page-render

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: _docker/page-render
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
