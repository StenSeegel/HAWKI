name: Build app image

# Builds the prebuilt HAWKI app image and pushes it to GHCR.
# - push to `staging`      -> :staging + :staging-<sha>   (staging Vite values)
# - tag v*                 -> :<version> (+ :latest unless the tag has an -rc suffix)
#                             (prod Vite values from .github/docker-build.prod.env)
# - workflow_dispatch      -> :<profile>-<sha> for the chosen profile, from any ref
#
# Version tags follow v<upstream base>.<fork revision>, e.g. v2.3.2.1 — four
# parts, which is NOT valid semver, so the tag is derived with type=match
# rather than type=semver (semver would silently emit no tag at all).
#
# Every profile builds the `app_staging` Dockerfile target: it declares
# `VOLUME /var/www/html/public`, which nginx relies on via `volumes_from` in
# both deployed stacks. `app_prod` lacks that volume and only works with the
# unused docker-compose.prod.yml named-volume layout.
#
# The Dockerfile and PHP runtime config come from the deployment repo
# (StenSeegel/hawki-docker), which is the single source of truth — the
# Dockerfile tracked in this repo is NOT used here.

on:
  push:
    branches: [staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      profile:
        description: Frontend build profile (which docker-build.<profile>.env to bake in)
        type: choice
        options: [staging, prod]
        default: staging
        required: true

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/stenseegel/hawki

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check out deployment repository (SSOT for Dockerfile & PHP config)
        uses: actions/checkout@v4
        with:
          repository: StenSeegel/hawki-docker
          ref: main
          path: deploy

      - name: Overlay Dockerfile and PHP config from deployment repo
        run: |
          cp deploy/dockerfile/Dockerfile src/Dockerfile
          cp deploy/php/config/* src/docker/php/config/

      - name: Select build profile
        id: profile
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            profile=prod
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            profile="${{ inputs.profile }}"
          else
            profile=staging
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "env_file=.github/docker-build.$profile.env" >> "$GITHUB_OUTPUT"
          echo "Building profile: $profile"

      - name: Load frontend build args
        run: grep -Ev '^\s*(#|$)' "src/${{ steps.profile.outputs.env_file }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=staging-,enable=${{ github.ref == 'refs/heads/staging' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc') }}
            type=sha,prefix=${{ steps.profile.outputs.profile }}-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          target: app_staging
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DOCKER_UID=33
            DOCKER_GID=33
            CACHEBUST=${{ github.sha }}
            VITE_APP_NAME=${{ env.VITE_APP_NAME }}
            VITE_REVERB_APP_KEY=${{ env.VITE_REVERB_APP_KEY }}
            VITE_REVERB_HOST=${{ env.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ env.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ env.VITE_REVERB_SCHEME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
