# =====================================================
# HAWKI - Staging Docker Compose Configuration
# =====================================================
# Staging environment with:
# - Code baked into Docker image (no live mounting)
# - Debug mode enabled for testing
# - No Adminer (production-like)
# - Write access to cache/storage directories
# =====================================================

# Outbound HTTP(S) must use the campus proxy. These used to be baked into the
# image as ENV at on-host build time; the prebuilt CI image ships without
# them, so every service running the app image needs them at runtime.
# Lowercase variants included: libcurl and many CLIs only read those.
# NO_PROXY must list every compose service the app reaches over HTTP
# (file-converter, realtime-bridge, ...) - the proxy cannot resolve them.
x-proxy-env: &proxy-env
    HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
    HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
    NO_PROXY: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,reverb,file-converter,realtime-bridge,audio-ingest,redis,mysql,nginx,host.docker.internal,.uni-giessen.de}
    http_proxy: ${DOCKER_HTTP_PROXY:-}
    https_proxy: ${DOCKER_HTTPS_PROXY:-}
    no_proxy: ${DOCKER_NO_PROXY:-localhost,127.0.0.1,reverb,file-converter,realtime-bridge,audio-ingest,redis,mysql,nginx,host.docker.internal,.uni-giessen.de}

# Addresses of sibling services follow from this file, not from the host: the
# converter has listened on port 80 since 2.x (1.x used 8001). Set here so a
# stale HAWKI_FILE_CONVERTER_API_URL in env/.env cannot point at the old port.
x-service-urls: &service-urls
    HAWKI_FILE_CONVERTER_API_URL: http://file-converter/extract

# Optional feature groups, enabled via COMPOSE_PROFILES (comma-separated):
#   transcription  audio-ingest + the transcription queue workers and listener;
#                  needs the S3_* settings (bucket + credentials)
#   realtime       realtime-bridge + coturn; needs TURN_* (update-staging.sh
#                  refuses to start it with an empty TURN_PASSWORD)
# Services without a profile always run. env/.env.<profile> enables both by
# default; a host that lacks a prerequisite overrides COMPOSE_PROFILES in
# env/.env (an empty value disables both groups).
services:
    # ====================================================
    # Application Container (PHP-FPM) - STAGING
    # ====================================================
    # Prebuilt image from CI — every push to the `staging` branch of the app
    # repo builds and pushes it (see .github/workflows there). No local build:
    # deploy scripts only pull. Vite assets (and their VITE_REVERB_* values)
    # are baked into the image at CI time from .github/docker-build.staging.env.
    app:
        container_name: ${PROJECT_NAME}-app
        image: ${PROJECT_HAWKI_IMAGE}
        restart: unless-stopped
        volumes:
            # NO code mount - code is in the image
            # Only mount external files/directories
            - ../env/.env:/var/www/html/.env:ro
            # Mount entire storage directory from host (includes user uploads via public/storage symlink)
            - ../storage:/var/www/html/storage
            # Mount ONLY the build directory for Vite assets
            # All other public assets (css/, js/, img/, etc.) come from Docker image
            - staging_build:/var/www/html/public/build
            # Mount config files
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
            - ../config/model_lists:/var/www/html/config/model_lists:ro
        healthcheck:
            test: cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 30s
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
            REVERB_HOST: ${APP_URL}
        # Lets the app reach host-networked services (realtime-bridge) via
        # host.docker.internal on plain Linux hosts.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mysql:
                condition: service_healthy

    # ====================================================
    # Queue Worker - STAGING
    # ====================================================
    queue:
        container_name: ${PROJECT_NAME}-queue
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: [ 'php', 'artisan', 'queue:work', '--queue=default,mails,message_broadcast', '--tries=3', '--timeout=90' ]
        depends_on:
            mysql:
                condition: service_healthy

    # ====================================================
    # Transcription Queue Worker - STAGING
    # ====================================================
    # Separate connection/queue from 'queue' above: whole-file diarization
    # (AnalyzeSpeakersJob) can run for up to ~1 hour (see config/queue.php's
    # 'transcription' connection) and would otherwise block mail/broadcast
    # delivery on the shared single-job-at-a-time worker above for its whole
    # duration. See _docker/docs/transcription/queue-dispatch.md.
    queue-transcription:
        profiles: ["transcription"]
        container_name: ${PROJECT_NAME}-queue-transcription
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: [ 'php', 'artisan', 'queue:work', 'transcription', '--queue=transcription', '--tries=1', '--timeout=3900' ]
        depends_on:
            mysql:
                condition: service_healthy

    # ====================================================
    # Transcription Process Queue Worker - STAGING
    # ====================================================
    # Phase 2 of the transcription workflow (ProcessTranscriptionJob: parallel
    # chunk transcription + final whole-file diarization + optional LLM
    # cleanup). Separate worker from queue-transcription above so a running
    # phase-2 pass never blocks other users' speaker previews, with roughly
    # double the timeout budget (two diarization-scale operations back to
    # back). See _docker/docs/transcription/queue-dispatch.md.
    queue-transcription-process:
        profiles: ["transcription"]
        container_name: ${PROJECT_NAME}-queue-transcription-process
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: [ 'php', 'artisan', 'queue:work', 'transcription_process', '--queue=transcription_process', '--tries=1', '--timeout=7800' ]
        depends_on:
            mysql:
                condition: service_healthy


    # ====================================================
    # Transcription Listener - STAGING
    # ====================================================
    transcription-listener:
        profiles: ["transcription"]
        container_name: ${PROJECT_NAME}-transcription-listener
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
        command: [ 'php', 'artisan', 'transcription:listen-status' ]
        depends_on:
            mysql:
                condition: service_healthy
                
    # ====================================================
    # Laravel Reverb (WebSocket Server) - STAGING
    # ====================================================
    reverb:
        container_name: ${PROJECT_NAME}-reverb
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
        command: [ 'php', 'artisan', 'reverb:start' ]
        depends_on:
            mysql:
                condition: service_healthy
                
    # ====================================================
    # Task Scheduler - STAGING
    # ====================================================
    scheduler:
        container_name: ${PROJECT_NAME}-scheduler
        image: ${PROJECT_HAWKI_IMAGE}
        restart: always
        volumes:
            - ../env/.env:/var/www/html/.env:ro
            - ../storage:/var/www/html/storage
            - ../config/model_providers.php:/var/www/html/config/model_providers.php:ro
        env_file:
            - ../env/.env
        environment:
            <<: [ *proxy-env, *service-urls ]
        command: [ 'php', 'artisan', 'schedule:work' ]
        depends_on:
            mysql:
                condition: service_healthy
            
    # ====================================================
    # Nginx Web Server - STAGING
    # ====================================================
    nginx:
        container_name: ${PROJECT_NAME}-nginx
        image: nginx:1.27-alpine
        restart: always
        volumes:
            - ../certs:/etc/nginx/certs
            - ../nginx/nginx.default.conf:/etc/nginx/nginx.conf:ro
            # Mount storage/app/public from host for uploads (read-only for nginx)
            # This maps to /storage/* URLs via public/storage symlink or nginx location
            - ../storage/app/public:/var/www/html/storage/app/public:ro
            # Mount build directory with Vite assets
            - staging_build:/var/www/html/public/build:ro
        # Share filesystem from app container to access public/ files (css, js, img, etc.) from Docker image
        volumes_from:
            - app:ro
        ports:
            # Note: NGINX_HTTP_PORT is unused — these mappings are literal.
            - ${DOCKER_PROJECT_IP:-0.0.0.0}:80:80
            - ${DOCKER_PROJECT_IP:-0.0.0.0}:443:443
        depends_on:
            - app
        healthcheck:
            test: curl --fail http://localhost || exit 1
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s
            
    # ====================================================
    # File Converter Service
    # ====================================================
    file-converter:
        # 3.x listens on port 80 (nginx) instead of 8001 and runs an embedded
        # Temporal server + PostgreSQL. Do NOT pass the HAWKI env file here: its
        # DB_PORT=3306 would override the converter's internal postgres port.
        image: digitalenvironments/hawki-toolkit-file-converter:3.0.2
        container_name: ${PROJECT_NAME}-file-converter
        restart: always
        environment:
            - F_API_KEY=${HAWKI_FILE_CONVERTER_API_KEY:-}
            # Extract figures from documents as assets/*.webp and reference them
            # in the chunk markdown (off by default since converter 3.0.2).
            - SAVE_DOCUMENT_IMAGE_REFS=${FILE_CONVERTER_SAVE_IMAGE_REFS:-true}
            # Tesseract OCR languages used when language detection fails.
            - OCR_LANGUAGES=${FILE_CONVERTER_OCR_LANGUAGES:-de,en}
        volumes:
            # Temporal/PostgreSQL state; without it every recreate re-runs initdb
            - file_converter_data:/var/lib/postgresql/17/main
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # ====================================================
    # draw.io (self-hosted diagram viewer and editor)
    # ====================================================
    # The chat shows draw.io diagrams a model writes and lets the user edit
    # them in an embedded editor. Both come from this container, proxied by
    # nginx at /drawio/, so no diagram ever leaves this host. draw.io is a
    # client-side app; the container is only a static server for it.
    drawio:
        image: jgraph/drawio:28.2.5
        container_name: ${PROJECT_NAME}-drawio
        restart: always
        environment:
            # Every link the app builds stays under HAWKI's own host.
            - DRAWIO_BASE_URL=${APP_URL}/drawio
            - DRAWIO_SERVER_URL=${APP_URL}/drawio/
            - DRAWIO_VIEWER_URL=${APP_URL}/drawio/js/viewer-static.min.js
            - DRAWIO_LIGHTBOX_URL=${APP_URL}/drawio
            # No calls to diagrams.net for templates, plugins or fonts.
            - DRAWIO_SELF_CONTAINED=1
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # ====================================================
    # Realtime Bridge (WebRTC -> vLLM realtime WebSocket)
    # ====================================================
    # Bridges browser WebRTC voice input to the vLLM realtime STT endpoint
    # behind the LiteLLM gateway, so no gateway API key ever reaches the
    # browser. Host networking is required: WebRTC media runs over UDP on
    # ephemeral ports and aiortc's ICE candidates must carry a
    # host-reachable address. The host firewall must allow inbound UDP for
    # WebRTC media. The Laravel app reaches the signaling endpoint via
    # REALTIME_BRIDGE_URL (default http://host.docker.internal:8089; the
    # app service maps host.docker.internal to the host gateway above).
    # Prebuilt image from this repo's CI (builds on push to main touching
    # realtime-bridge/**).
    realtime-bridge:
        profiles: ["realtime"]
        container_name: ${PROJECT_NAME}-realtime-bridge
        image: ${PROJECT_REALTIME_BRIDGE_IMAGE:-ghcr.io/stenseegel/hawki-realtime-bridge:latest}
        restart: always
        network_mode: host
        environment:
            PORT: ${REALTIME_BRIDGE_PORT:-8089}
            BRIDGE_API_KEY: ${REALTIME_BRIDGE_API_KEY:-}
            # WebRTC media cannot use host candidates here: only 22/80/443 pass
            # the firewall to this host, so ICE stalls at "connecting" and no
            # audio arrives. A TURN relay on a permitted port fixes it.
            TURN_URLS: ${TURN_URLS:-}
            TURN_USERNAME: ${TURN_USERNAME:-}
            TURN_PASSWORD: ${TURN_PASSWORD:-}
            STUN_URLS: ${STUN_URLS:-}


    # ====================================================
    # Audio Ingest Worker (transcription preprocessing)
    # ====================================================
    # Chunks uploaded audio for the transcription pipeline: consumes
    # `audio_preprocessing_jobs` from the stack's Redis (DB 2), downloads the
    # original from S3, uploads chunks + manifest, reports status back.
    # CPU/I/O only — deliberately capped so a long file never starves the
    # web workload. Lives in this stack (not on the inference server): Redis
    # stays network-internal and it shares this environment's S3 settings.
    # Authenticates against the stack Redis with the same REDIS_PASSWORD the
    # Laravel side uses (worker.py reads it, redis-py sends AUTH) — see the
    # redis service below, which is what actually enforces it.
    audio-ingest:
        profiles: ["transcription"]
        container_name: ${PROJECT_NAME}-audio-ingest
        image: ghcr.io/stenseegel/audio-ingest:latest
        restart: always
        cpus: 2
        environment:
            REDIS_HOST: redis
            REDIS_PASSWORD: ${REDIS_PASSWORD:-}
            REDIS_DB: ${REDIS_AUDIO_INGEST_DB:-2}
            QUEUE_NAME: ${AUDIO_PREPROCESSING_QUEUE:-audio_preprocessing_jobs}
            STATUS_QUEUE: audio_preprocessing_status
            S3_ENDPOINT_URL: ${S3_ENDPOINT}
            # boto3 ships its own CA bundle that can lag behind system CAs
            # (e.g. HARICA/GEANT roots) — trust the distro bundle instead.
            AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
            S3_ACCESS_KEY: ${S3_ACCESS_KEY}
            S3_SECRET_KEY: ${S3_SECRET_KEY}
            S3_REGION: ${S3_REGION:-us-east-1}
            WORKER_ID: ${PROJECT_NAME}-audio-ingest
        depends_on:
            - redis

    # ====================================================
    # coturn — TURN relay for realtime WebRTC
    # ====================================================
    # Why this exists: the browser frequently has NO ICE candidate that can
    # reach this host. On the JLU VPN, Chrome gathers host candidates only on
    # interfaces with no route here and never on the VPN tunnel, so every direct
    # candidate pair fails and live transcription hangs in "connecting" with no
    # error. TURN fixes it because the browser reaches the relay over ordinary
    # TCP routing instead of via ICE interface enumeration.
    #
    # Why TLS on 6443: 443 belongs to nginx. 8443 is permitted but is DPI-
    # inspected — measured 2026-08-21, server->client data is silently dropped
    # after ~4880 bytes, so a TLS handshake (ServerHello + 7.5 KB cert chain)
    # can never complete. 6443 is permitted AND uninspected (60 KB verified
    # intact). Ports 80/22 are blocked by default.
    #
    # The TLS cert is the one nginx already serves: clients connect to
    # turns:<same hostname>:8443, so no extra DNS name or certificate is needed.
    # Runs as root because key.pem is root-only — coturn would otherwise fail to
    # read it and silently fall back to defaults while still looking healthy.
    #
    # Host networking: relay ports must sit on the host stack directly; a
    # published range would spawn one docker-proxy process per port.
    # The relay range needs no firewall rule — the only peer is the local bridge.
    #
    # The credential is passed on the command line rather than via a config file
    # because it is not a secret: the browser must authenticate to the relay, so
    # Laravel hands the same credential to the client (see the ice-servers meta
    # tag). Production should use coturn's time-limited REST credentials instead.
    #
    # Pinned, not :latest — the auto-deploy timer pulls unattended, and a
    # floating tag would silently jump a major version on some unrelated
    # rollout. Bump deliberately.
    coturn:
        profiles: ["realtime"]
        container_name: ${PROJECT_NAME}-coturn
        image: coturn/coturn:4.17.2
        restart: unless-stopped
        network_mode: host
        user: "0:0"
        volumes:
            - ../certs:/etc/coturn/certs:ro
        command:
            - -n
            - --log-file=stdout
            - --simple-log
            - --tls-listening-port=${TURN_TLS_PORT:-6443}
            - --cert=/etc/coturn/certs/cert.pem
            - --pkey=/etc/coturn/certs/key.pem
            # Do NOT pass --no-tcp: TLS runs *over* TCP, so disabling the TCP
            # transport leaves the TLS port bound but unable to complete a
            # handshake (connect succeeds, then hangs). Plain listeners on the
            # default 3478 are harmless — that port is filtered inbound by
            # policy. DTLS is off by default in current coturn.
            - --realm=${TURN_REALM:-${NGINX_SERVER_NAME}}
            - --lt-cred-mech
            - --user=${TURN_USERNAME:-hawki}:${TURN_PASSWORD:-}
            - --fingerprint
            - --min-port=${TURN_MIN_PORT:-49160}
            - --max-port=${TURN_MAX_PORT:-49250}
            - --no-multicast-peers
            - --allow-loopback-peers
            # Verbose: without it coturn logs no per-session lines at all, which
            # makes relay problems undiagnosable.
            - --verbose

    # ====================================================
    # Redis Cache
    # ====================================================
    # Pinned, not :latest — the auto-deploy timer pulls unattended, and a
    # floating tag would silently jump a major version on some unrelated
    # rollout. Bump deliberately.
    redis:
        container_name: ${PROJECT_NAME}-redis
        image: redis:8.10.1
        restart: always
        env_file:
            - ../env/.env
        volumes:
            - redis_data:/root/redis
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
            REDIS_PORT: ${REDIS_PORT:-6379}
            REDIS_DATABASES: 16
        # The official redis image ignores REDIS_PASSWORD/REDIS_DATABASES —
        # those are Bitnami conventions. Without this command the server comes
        # up completely unauthenticated while every client still authenticates
        # with REDIS_PASSWORD from .env. `$$VAR` is escaped so compose hands the
        # literal name to the container shell, which resolves it from the
        # environment above — the secret stays out of the rendered config.
        command:
            - sh
            - -c
            - exec redis-server --requirepass "$$REDIS_PASSWORD" --databases "$${REDIS_DATABASES:-16}"
        healthcheck:
            test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG" ]
            interval: 10s
            timeout: 5s
            retries: 5


    # ====================================================
    # MySQL Database
    # ====================================================
    mysql:
        container_name: ${PROJECT_NAME}-mysql
        image: mysql:8.0
        command:
            - --default-authentication-plugin=mysql_native_password
            - --max_connections=2000
        env_file:
            - ../env/.env
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
            MYSQL_DATABASE: ${DB_DATABASE:-hawki}
            MYSQL_USER: ${DB_USERNAME:-hawki}
            MYSQL_PASSWORD: ${DB_PASSWORD:-password}
        ulimits:
            nofile:
                soft: 65536
                hard: 65536
        restart: unless-stopped
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - ${DOCKER_PROJECT_IP:-127.0.0.1}:${DB_EXTERNAL_PORT:-3307}:3306
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-hawki}", "-p${DB_PASSWORD:-password}"]
            start_period: 10s
            timeout: 20s
            interval: 5s
            retries: 10

# ====================================================
# Volumes
# ====================================================
volumes:
    mysql_data:
        name: hawki-staging_mysql_data
        external: true
    redis_data:
        name: hawki-staging_redis_data
        external: true
    # Named after PROJECT_NAME because update-staging.sh removes this volume
    # by that name on every --update: Docker copies the image's public/build
    # into a named volume only while it is empty, so a volume that survives
    # the update keeps serving the previous release's Vite assets.
    staging_build:
        name: ${PROJECT_NAME}_staging_build
    file_converter_data:
        name: hawki-staging_file_converter_data
        driver: local
    # Note: staging_public volume removed - static assets (css, js, img) come from Docker image
    # User uploads are handled via storage mount + public/storage symlink in image


